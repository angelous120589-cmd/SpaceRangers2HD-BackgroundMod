[Plugin]
Enabled=1

[FastNewGame]
; IMPORTANT: All 300 game days are preserved.
Enabled=1

; Experimental approximate world simulation during game creation.
; Compresses movement/combat subdivisions from 50 (other stars) and
; 200 (player star) to 12 by default, without skipping any game days.
; Combat and collisions will differ from vanilla. This is NOT a
; deterministic auto-battle resolver and it does NOT teleport ships.
QuickSimulation=1
SimulationSubsteps=12

; Original v0.4 optimizations:
SkipPregameFilm=1
Profile=1
