name: Build FHD FastNewGame Native
on:
  push:
    branches: [feature/fhd-fastnewgame-native-0.4]
    paths-ignore: ['dist/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and package x86 DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC installation not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars32.bat'
          New-Item -ItemType Directory -Force build, staging/FHD_FastNewGame/Native, dist | Out-Null
          $command = 'call "' + $vcvars + '" && cl /nologo /LD /EHsc /O2 /W4 /DUNICODE /D_UNICODE /Fe:build\FHD_FastNewGame.XenoPlugin.dll src\fastnewgame.cpp src\fastnewgame.def /link /MACHINE:X86'
          cmd /c $command
          if ($LASTEXITCODE -ne 0) { throw "compiler exit code $LASTEXITCODE" }
          Copy-Item build/FHD_FastNewGame.XenoPlugin.dll staging/FHD_FastNewGame/Native/
          Copy-Item module/ModuleInfo.txt staging/FHD_FastNewGame/
          Copy-Item module/FHD_FastNewGame.XenoPlugin.ini staging/FHD_FastNewGame/Native/
          Copy-Item module/README_RU.txt staging/FHD_FastNewGame/
          $dll = [System.IO.File]::ReadAllBytes('staging/FHD_FastNewGame/Native/FHD_FastNewGame.XenoPlugin.dll')
          $pe = [BitConverter]::ToInt32($dll,0x3c)
          if ($dll[0] -ne 77 -or $dll[1] -ne 90 -or [BitConverter]::ToUInt16($dll,$pe+4) -ne 0x14c) { throw 'DLL is not PE32 x86' }
          Compress-Archive -Path staging/FHD_FastNewGame -DestinationPath dist/FHD_FastNewGame_Native_v0.4.zip -Force
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path dist/FHD_FastNewGame_Native_v0.4.zip).Path)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            foreach ($expected in @('FHD_FastNewGame/ModuleInfo.txt','FHD_FastNewGame/Native/FHD_FastNewGame.XenoPlugin.dll','FHD_FastNewGame/Native/FHD_FastNewGame.XenoPlugin.ini')) {
              if ($names -notcontains $expected) { throw "Missing file in ZIP: $expected" }
            }
            if (@($names | Where-Object { $_.EndsWith('.lib') -or $_.EndsWith('.exp') -or $_.EndsWith('.obj') }).Count -ne 0) { throw 'Build-only files leaked into ZIP' }
          } finally { $archive.Dispose() }
          Get-FileHash dist/FHD_FastNewGame_Native_v0.4.zip -Algorithm SHA256 | Format-List
      - name: Upload installable mod
        uses: actions/upload-artifact@v4
        with:
          name: FHD_FastNewGame_Native_v0.4
          path: dist/FHD_FastNewGame_Native_v0.4.zip
          if-no-files-found: error
      - name: Publish the installable ZIP
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/FHD_FastNewGame_Native_v0.4.zip
          git commit -m "Package FHD FastNewGame native v0.4 [skip ci]"
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          git push
          if ($LASTEXITCODE -ne 0) { throw 'Push failed' }
