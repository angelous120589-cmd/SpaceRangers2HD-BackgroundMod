name: Build FHD FastNewGame Native
on:
  push:
    branches:
      - feature/fhd-fastnewgame-native-0.3
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build 32-bit Windows DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC installation not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars32.bat'
          New-Item -ItemType Directory -Force build, staging/FHD_FastNewGame/Native | Out-Null
          $command = 'call "' + $vcvars + '" && cl /nologo /LD /EHsc /O2 /W4 /DUNICODE /D_UNICODE /Fe:staging\FHD_FastNewGame\Native\FHD_FastNewGame.XenoPlugin.dll src\fastnewgame.cpp src\fastnewgame.def /link /MACHINE:X86'
          cmd /c $command
          if ($LASTEXITCODE -ne 0) { throw "compiler exit code $LASTEXITCODE" }
          Copy-Item module/ModuleInfo.txt staging/FHD_FastNewGame/
          Copy-Item module/FHD_FastNewGame.XenoPlugin.ini staging/FHD_FastNewGame/Native/
          Copy-Item module/README_RU.txt staging/FHD_FastNewGame/
          $exe = 'staging/FHD_FastNewGame/Native/FHD_FastNewGame.XenoPlugin.dll'
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'invalid PE DLL' }
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x14c) { throw 'DLL is not 32-bit x86' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path staging/FHD_FastNewGame -DestinationPath dist/FHD_FastNewGame_Native_v0.3.zip -Force
          Get-FileHash dist/FHD_FastNewGame_Native_v0.3.zip -Algorithm SHA256 | Format-List
      - name: Upload installable mod
        uses: actions/upload-artifact@v4
        with:
          name: FHD_FastNewGame_Native_v0.3
          path: dist/FHD_FastNewGame_Native_v0.3.zip
          if-no-files-found: error
      - name: Publish ZIP to isolated branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/FHD_FastNewGame_Native_v0.3.zip
          git commit -m "Build FHD FastNewGame native v0.3 [skip ci]"
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          git push
          if ($LASTEXITCODE -ne 0) { throw 'Push failed' }
