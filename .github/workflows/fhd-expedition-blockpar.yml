name: FHD Expedition BlockPar build
on:
  push:
    branches: [fhd-expedition-wide-build]
    paths:
      - '.github/workflows/fhd-expedition-blockpar.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blockpar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fhd-expedition-wide-build

      - name: Restore corrected Lang and patch wide picker container
        shell: pwsh
        run: |
          @'
          import base64,gzip,hashlib,pathlib
          r=pathlib.Path('_ci/fhd_expedition')
          parts=sorted(r.glob('LangValid.part*'))
          if len(parts)!=6: raise SystemExit(f'expected 6 Lang chunks, got {len(parts)}')
          raw=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts)))
          if hashlib.sha256(raw).hexdigest()!='569c48b95996ca265e8d77e8e2b750bbf6f54a6fcc179b9c50ab2110059b8416': raise SystemExit('Lang SHA mismatch')
          r.joinpath('Lang.txt').write_bytes(raw)
          p=r/'Main.txt'; text=p.read_text(encoding='utf-8-sig')
          needle='            FHDExpPlanetPickerContainer ^{\n                Window ^{'
          repl='            FHDExpPlanetPickerContainer ^{\n                Panel ^{'
          if needle not in text: raise SystemExit('wide picker Window block not found')
          text=text.replace(needle,repl,1)
          p.write_text(text,encoding='utf-8-sig')
          '@ | python -

      - name: Download official BlockParEditor 2.1
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/indiemagpie/BlockParEditor/releases/download/2.1/BlockParEditor_2.1.zip' -OutFile bpe.zip
          if((Get-FileHash bpe.zip -Algorithm SHA256).Hash.ToLower() -ne 'd0c4739f9fbf1c276ac6979c13e838b217694ac16400109db7ed53435f0d0253'){throw 'BPE ZIP hash mismatch'}
          Expand-Archive bpe.zip bpe -Force
          $e=Get-ChildItem bpe -Filter BlockParEditor.exe -Recurse | Select-Object -First 1
          if((Get-FileHash $e.FullName -Algorithm SHA256).Hash.ToLower() -ne '84d1fa626451f165135139ec9d00306207ba765b2ca3071591009f831b5711fa'){throw 'BPE EXE hash mismatch'}
          Set-Content bpe_path.txt $e.FullName

      - name: Build DATs with BlockParEditor
        shell: pwsh
        run: |
          $e=(Get-Content bpe_path.txt -Raw).Trim(); $r=(Resolve-Path '_ci/fhd_expedition').Path
          Remove-Item out,verify -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force out/CFG/Rus | Out-Null
          foreach($n in @('Main','Lang','CacheData')){
            $src=Join-Path $r ($n+'.txt'); $dat=Join-Path $r ($n+'.dat')
            Remove-Item $dat -Force -ErrorAction SilentlyContinue
            & $e --cli --convert $src; Start-Sleep -Milliseconds 900
            if(!(Test-Path $dat)){throw "$n.dat not created"}
          }
          Copy-Item "$r/Main.dat" out/CFG/Main.dat
          Copy-Item "$r/Lang.dat" out/CFG/Rus/Lang.dat
          Copy-Item "$r/CacheData.dat" out/CFG/CacheData.dat
          New-Item -ItemType Directory -Force verify/Main,verify/Lang,verify/CacheData | Out-Null
          Copy-Item out/CFG/Main.dat verify/Main/Main.dat
          Copy-Item out/CFG/Rus/Lang.dat verify/Lang/Lang.dat
          Copy-Item out/CFG/CacheData.dat verify/CacheData/CacheData.dat
          & $e --cli --convert (Resolve-Path verify/Main/Main.dat).Path
          & $e --cli --convert (Resolve-Path verify/Lang/Lang.dat).Path
          & $e --cli --convert (Resolve-Path verify/CacheData/CacheData.dat).Path
          Start-Sleep -Milliseconds 900
          Copy-Item verify/Main/Main.txt out/Main.roundtrip.txt
          Copy-Item verify/Lang/Lang.txt out/Lang.roundtrip.txt
          Copy-Item verify/CacheData/CacheData.txt out/CacheData.roundtrip.txt

      - name: Validate panel-based picker and script tree
        shell: pwsh
        run: |
          @'
          import pathlib
          def rd(p):
              b=pathlib.Path(p).read_bytes()
              if b.startswith((b'\xff\xfe',b'\xfe\xff')): return b.decode('utf-16')
              if b'\x00' in b[:128]: return b.decode('utf-16-le')
              try:return b.decode('utf-8-sig')
              except:return b.decode('cp1251')
          main=rd('out/Main.roundtrip.txt'); lang=rd('out/Lang.roundtrip.txt')
          if 'Name=FHDExpPlanetPicker' not in main or 'Size=960,640' not in main: raise SystemExit('wide picker missing')
          if 'Window ^{' in main: raise SystemExit('unsafe TWindowGI remains in Main.dat')
          if 'Panel ^{' not in main: raise SystemExit('panel UI missing')
          for x in ('FHDExpedition ^{','Open ~{','ShowPlanetPage ~{','PickPlanetRow ~{','ContinueNewExpedition ~{'):
              if x not in lang: raise SystemExit('Lang missing '+x)
          pathlib.Path('out/VALIDATION.txt').write_text('PASS\n960x640 picker uses Panel and no TWindowGI block remains.\nScript tree present.\nOfficial BlockParEditor 2.1 DAT -> TXT verification passed.\n',encoding='utf-8')
          '@ | python -
          $r=@('Official BlockParEditor 2.1','Main.dat / Lang.dat: Main, Lang - HD','CacheData.dat: CacheData - HD','Wide picker: Panel, no empty TWindowGI')
          foreach($p in @('out/CFG/Main.dat','out/CFG/Rus/Lang.dat','out/CFG/CacheData.dat')){$r+="$p size=$((Get-Item $p).Length) sha256=$((Get-FileHash $p -Algorithm SHA256).Hash.ToLower())"}
          $r | Set-Content out/BLOCKPAREDITOR_BUILD_REPORT.txt -Encoding UTF8

      - uses: actions/upload-artifact@v4
        with:
          name: fhd-expedition-v033-panel-picker
          path: out
