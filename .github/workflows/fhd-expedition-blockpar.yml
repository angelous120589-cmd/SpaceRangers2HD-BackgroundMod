name: FHD Expedition BlockPar build
on:
  push:
    branches: [fhd-expedition-wide-build]
    paths: ['_ci/fhd_expedition/MainMerged.part*','_ci/fhd_expedition/LangRuntime.gz.b64','_ci/fhd_expedition/CacheData.txt','.github/workflows/fhd-expedition-blockpar.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blockpar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fhd-expedition-wide-build
      - name: Restore sources
        shell: pwsh
        run: |
          @'
          import base64,gzip,hashlib,pathlib
          r=pathlib.Path('_ci/fhd_expedition')
          p=sorted(r.glob('MainMerged.part*'))
          if len(p)!=8: raise SystemExit(f'expected 8 chunks, got {len(p)}')
          raw=gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in p)))
          if hashlib.sha256(raw).hexdigest()!='3778687a77ea0073d5cd110229a14b9b8399ebb09c6c55bdd63d945e94c237b7': raise SystemExit('Main SHA mismatch')
          r.joinpath('Main.txt').write_bytes(raw)
          lp=r.joinpath('LangRuntime.gz.b64').read_text().strip()
          lr=gzip.decompress(base64.b64decode(lp))
          if hashlib.sha256(lr).hexdigest()!='9c7457403550ecb922caee24916e90e34182806f9ccd2302b15b6f6d408fa7b6': raise SystemExit('Lang SHA mismatch')
          r.joinpath('Lang.txt').write_bytes(lr)
          m=raw.decode('utf-8-sig'); l=lr.decode('utf-8-sig')
          assert 'FHDExpedition ^{' in m and 'Open ~{' in m and 'FHDExpPlanetPicker' in m
          assert 'FHDExpeditionProbe ^{' in l and 'FHDExpedition ^{' not in l
          '@ | python -
      - name: Download BlockParEditor 2.1
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/indiemagpie/BlockParEditor/releases/download/2.1/BlockParEditor_2.1.zip' -OutFile bpe.zip
          if((Get-FileHash bpe.zip -Algorithm SHA256).Hash.ToLower() -ne 'd0c4739f9fbf1c276ac6979c13e838b217694ac16400109db7ed53435f0d0253'){throw 'BPE zip hash mismatch'}
          Expand-Archive bpe.zip bpe -Force
          $e=Get-ChildItem bpe -Filter BlockParEditor.exe -Recurse | Select-Object -First 1
          if((Get-FileHash $e.FullName -Algorithm SHA256).Hash.ToLower() -ne '84d1fa626451f165135139ec9d00306207ba765b2ca3071591009f831b5711fa'){throw 'BPE exe hash mismatch'}
          Set-Content bpe_path.txt $e.FullName
      - name: Build DATs
        shell: pwsh
        run: |
          $e=(Get-Content bpe_path.txt -Raw).Trim(); $r=(Resolve-Path '_ci/fhd_expedition').Path
          New-Item -ItemType Directory -Force out/CFG/Rus | Out-Null
          foreach($n in @('Main','Lang','CacheData')){
            Remove-Item (Join-Path $r ($n+'.dat')) -Force -ErrorAction SilentlyContinue
            & $e --cli --convert (Join-Path $r ($n+'.txt')); Start-Sleep -Milliseconds 1200
            if(!(Test-Path (Join-Path $r ($n+'.dat')))){throw "$n.dat not created"}
          }
          Copy-Item "$r/Main.dat" out/CFG/Main.dat
          Copy-Item "$r/Lang.dat" out/CFG/Rus/Lang.dat
          Copy-Item "$r/CacheData.dat" out/CFG/CacheData.dat
          New-Item -ItemType Directory -Force verify | Out-Null
          Copy-Item out/CFG/Main.dat verify/Main.dat
          & $e --cli --convert (Resolve-Path verify/Main.dat).Path; Start-Sleep -Milliseconds 1200
          if(!(Test-Path verify/Main.txt)){throw 'Main reverse conversion failed'}
          $raw=[IO.File]::ReadAllBytes((Resolve-Path verify/Main.txt).Path)
          if($raw.Length -ge 2 -and $raw[0] -eq 255 -and $raw[1] -eq 254){$t=[Text.Encoding]::Unicode.GetString($raw,2,$raw.Length-2)} elseif($raw -contains 0){$t=[Text.Encoding]::Unicode.GetString($raw)} else {$t=[Text.Encoding]::UTF8.GetString($raw)}
          if($t -notmatch 'FHDExpedition \^\{' -or $t -notmatch 'Open ~\{' -or $t -notmatch 'FHDExpPlanetPicker'){throw 'Main runtime verification failed'}
          'PASS - Script.FHDExpedition.Open is in Main.dat after BlockParEditor reverse conversion.' | Set-Content out/RUNTIME_PATH_VALIDATION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fhd-expedition-main-runtime-dats
          path: out
