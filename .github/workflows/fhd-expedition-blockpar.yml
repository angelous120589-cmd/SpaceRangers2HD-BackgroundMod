name: FHD Expedition BlockPar build

on:
  push:
    branches:
      - fhd-expedition-wide-build
    paths:
      - '_ci/fhd_expedition/Main.txt'
      - '_ci/fhd_expedition/Lang.part*'
      - '_ci/fhd_expedition/CacheData.txt'
      - '.github/workflows/fhd-expedition-blockpar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blockpar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fhd-expedition-wide-build

      - name: Restore and verify Lang source
        shell: pwsh
        run: |
          @'
          import base64, gzip, hashlib, pathlib
          root = pathlib.Path('_ci/fhd_expedition')
          parts = sorted(root.glob('Lang.part*'))
          if len(parts) != 6:
              raise SystemExit(f'Expected 6 Lang chunks, got {len(parts)}')
          payload = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw = gzip.decompress(base64.b64decode(payload))
          expected = '86b4b7c8add7b7cd28e8a9bde8ecfe9a1f087aa8c639fc794b3d29efed7ec564'
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'Lang source SHA mismatch: {actual}')
          root.joinpath('Lang.txt').write_bytes(raw)
          text = raw.decode('utf-8-sig')
          for marker in (
              'FHDExpedition ^{',
              'Open ~{',
              'PickPlanetRow ~{',
              'ShowPlanetPage ~{',
              'FHDExpeditionProbe ^{',
              'FHDExpeditionUI ^{',
              'ShipInfo ^{',
          ):
              if marker not in text:
                  raise SystemExit(f'Missing required Lang source marker: {marker}')
          print('Lang bytes:', len(raw), 'sha256:', actual)
          '@ | python -

      - name: Download official BlockParEditor 2.1
        shell: pwsh
        run: |
          $url = 'https://github.com/indiemagpie/BlockParEditor/releases/download/2.1/BlockParEditor_2.1.zip'
          Invoke-WebRequest -Uri $url -OutFile 'BlockParEditor_2.1.zip'
          $zipHash = (Get-FileHash 'BlockParEditor_2.1.zip' -Algorithm SHA256).Hash.ToLower()
          if ($zipHash -ne 'd0c4739f9fbf1c276ac6979c13e838b217694ac16400109db7ed53435f0d0253') { throw "ZIP hash mismatch: $zipHash" }
          Expand-Archive -Path 'BlockParEditor_2.1.zip' -DestinationPath 'BlockParEditor' -Force
          $exe = Get-ChildItem 'BlockParEditor' -Filter 'BlockParEditor.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'BlockParEditor.exe not found' }
          $exeHash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          if ($exeHash -ne '84d1fa626451f165135139ec9d00306207ba765b2ca3071591009f831b5711fa') { throw "EXE hash mismatch: $exeHash" }
          Set-Content 'bpe_path.txt' $exe.FullName

      - name: Build DAT files with BlockParEditor
        shell: pwsh
        run: |
          $exe = (Get-Content 'bpe_path.txt' -Raw).Trim()
          $src = (Resolve-Path '_ci/fhd_expedition').Path
          New-Item -ItemType Directory -Force '_ci/fhd_expedition/out/CFG/Rus' | Out-Null
          New-Item -ItemType Directory -Force '_ci/fhd_expedition/verify/Main' | Out-Null
          New-Item -ItemType Directory -Force '_ci/fhd_expedition/verify/Lang' | Out-Null
          New-Item -ItemType Directory -Force '_ci/fhd_expedition/verify/CacheData' | Out-Null

          foreach ($name in @('Main','Lang','CacheData')) {
            $txt = Join-Path $src ($name + '.txt')
            Remove-Item (Join-Path $src ($name + '.dat')) -Force -ErrorAction SilentlyContinue
            & $exe --cli --convert $txt
            Start-Sleep -Milliseconds 500
            $dat = Join-Path $src ($name + '.dat')
            if (-not (Test-Path $dat)) { throw "$name.dat not created next to source" }
          }

          Copy-Item '_ci/fhd_expedition/Main.dat' '_ci/fhd_expedition/out/CFG/Main.dat' -Force
          Copy-Item '_ci/fhd_expedition/Lang.dat' '_ci/fhd_expedition/out/CFG/Rus/Lang.dat' -Force
          Copy-Item '_ci/fhd_expedition/CacheData.dat' '_ci/fhd_expedition/out/CFG/CacheData.dat' -Force

          Copy-Item '_ci/fhd_expedition/out/CFG/Main.dat' '_ci/fhd_expedition/verify/Main/Main.dat' -Force
          Copy-Item '_ci/fhd_expedition/out/CFG/Rus/Lang.dat' '_ci/fhd_expedition/verify/Lang/Lang.dat' -Force
          Copy-Item '_ci/fhd_expedition/out/CFG/CacheData.dat' '_ci/fhd_expedition/verify/CacheData/CacheData.dat' -Force

          & $exe --cli --convert (Resolve-Path '_ci/fhd_expedition/verify/Main/Main.dat').Path
          & $exe --cli --convert (Resolve-Path '_ci/fhd_expedition/verify/Lang/Lang.dat').Path
          & $exe --cli --convert (Resolve-Path '_ci/fhd_expedition/verify/CacheData/CacheData.dat').Path
          Start-Sleep -Milliseconds 500

          foreach ($p in @('_ci/fhd_expedition/verify/Main/Main.txt','_ci/fhd_expedition/verify/Lang/Lang.txt','_ci/fhd_expedition/verify/CacheData/CacheData.txt')) {
            if (-not (Test-Path $p)) { throw "Reverse conversion failed: $p" }
          }

      - name: Verify BlockPar semantic roundtrip
        shell: pwsh
        run: |
          @'
          import pathlib, re

          OPEN = re.compile(r'^\s*(.*?)\s+([\^~])\{\s*$')

          def read_text(path):
              raw = pathlib.Path(path).read_bytes()
              for enc in ('utf-8-sig', 'cp1251', 'utf-16'):
                  try:
                      return raw.decode(enc)
                  except UnicodeDecodeError:
                      pass
              raise SystemExit(f'Cannot decode {path}')

          def parse(path):
              root = {'name':'', 'op':'', 'entries':[]}
              stack = [root]
              for no, raw in enumerate(read_text(path).splitlines(), 1):
                  line = raw.strip()
                  if not line or line.startswith('//'):
                      continue
                  m = OPEN.match(raw)
                  if m:
                      node = {'name':m.group(1).strip(), 'op':m.group(2), 'entries':[]}
                      stack[-1]['entries'].append(('n', node))
                      stack.append(node)
                      continue
                  if line == '}':
                      if len(stack) == 1:
                          raise SystemExit(f'Extra }} in {path}:{no}')
                      stack.pop()
                      continue
                  if '=' in line:
                      key, value = line.split('=', 1)
                      stack[-1]['entries'].append(('p', key.strip(), value))
                      continue
                  raise SystemExit(f'Unknown BlockPar line {path}:{no}: {raw!r}')
              if len(stack) != 1:
                  raise SystemExit(f'Unclosed BlockPar block in {path}')
              return root

          def canonical(node):
              rows=[]
              for e in node['entries']:
                  if e[0]=='n':
                      n=e[1]
                      rows.append((n['name'].casefold(), ('n', n['name'], n['op'], canonical(n))))
                  else:
                      rows.append((e[1].casefold(), ('p', e[1], e[2])))
              rows.sort(key=lambda x:x[0])
              return tuple(v for _,v in rows)

          pairs = [
              ('_ci/fhd_expedition/Main.txt','_ci/fhd_expedition/verify/Main/Main.txt'),
              ('_ci/fhd_expedition/Lang.txt','_ci/fhd_expedition/verify/Lang/Lang.txt'),
              ('_ci/fhd_expedition/CacheData.txt','_ci/fhd_expedition/verify/CacheData/CacheData.txt'),
          ]
          for source, reverse in pairs:
              if canonical(parse(source)) != canonical(parse(reverse)):
                  raise SystemExit(f'Semantic roundtrip mismatch: {source} -> {reverse}')
              print('Semantic roundtrip OK:', source)

          lang = read_text('_ci/fhd_expedition/verify/Lang/Lang.txt')
          required = (
              'Script ^{',
              'FHDExpedition ^{',
              'Open ~{',
              'PickPlanetRow ~{',
              'ShowPlanetPage ~{',
              'ShipInfo ^{',
              'FHDExpeditionProbe ^{',
              'FHDExpeditionUI ^{',
          )
          for marker in required:
              if marker not in lang:
                  raise SystemExit(f'Roundtrip Lang missing marker: {marker}')
          '@ | python -

          $report = @()
          $report += 'BlockParEditor 2.1 official build'
          $report += 'Main.dat / Lang.dat: Main, Lang - HD'
          $report += 'CacheData.dat: CacheData - HD'
          $report += 'DAT -> TXT semantic roundtrip: OK for Main, Lang, CacheData'
          $report += 'Lang required blocks: Open, PickPlanetRow, ShowPlanetPage, ShipInfo, FHDExpeditionProbe, FHDExpeditionUI = PRESENT'
          foreach ($p in @('_ci/fhd_expedition/out/CFG/Main.dat','_ci/fhd_expedition/out/CFG/Rus/Lang.dat','_ci/fhd_expedition/out/CFG/CacheData.dat')) {
            $report += "$p | size=$((Get-Item $p).Length) | sha256=$((Get-FileHash $p -Algorithm SHA256).Hash.ToLower())"
          }
          $report | Set-Content '_ci/fhd_expedition/out/BLOCKPAREDITOR_BUILD_REPORT.txt' -Encoding UTF8

      - name: Commit generated DAT files
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f _ci/fhd_expedition/out
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'Build FHD Expedition DATs with BlockParEditor 2.1 [skip ci]'
          git push origin HEAD:fhd-expedition-wide-build

      - uses: actions/upload-artifact@v4
        with:
          name: fhd-expedition-blockpar-dats
          path: _ci/fhd_expedition/out
