name: FHD Expedition BlockPar build

on:
  push:
    branches: [fhd-expedition-wide-build]
    paths:
      - '.github/workflows/fhd-expedition-blockpar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blockpar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore FHD Expedition sources
        shell: pwsh
        run: |
          $payload = @'

'@
          [IO.File]::WriteAllBytes('sources.zip',[Convert]::FromBase64String($payload.Trim()))
          $h=(Get-FileHash 'sources.zip' -Algorithm SHA256).Hash.ToLower()
          if($h -ne 'ea22f504b92b586a027ad36e2345e46c94c820f6845785eaebfe859dd2af808e'){ throw "source payload hash mismatch: $h" }
          Expand-Archive -Path 'sources.zip' -DestinationPath 'fhd_exp_build' -Force

      - name: Download and verify official BlockParEditor 2.1
        shell: pwsh
        run: |
          $url='https://github.com/indiemagpie/BlockParEditor/releases/download/2.1/BlockParEditor_2.1.zip'
          Invoke-WebRequest -Uri $url -OutFile 'BlockParEditor_2.1.zip'
          $hash=(Get-FileHash 'BlockParEditor_2.1.zip' -Algorithm SHA256).Hash.ToLower()
          if($hash -ne 'd0c4739f9fbf1c276ac6979c13e838b217694ac16400109db7ed53435f0d0253'){ throw "BlockParEditor ZIP hash mismatch: $hash" }
          Expand-Archive -Path 'BlockParEditor_2.1.zip' -DestinationPath 'BlockParEditor' -Force
          $exe=Get-ChildItem 'BlockParEditor' -Filter 'BlockParEditor.exe' -Recurse | Select-Object -First 1
          if(-not $exe){ throw 'BlockParEditor.exe not found' }
          $exeHash=(Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          if($exeHash -ne '84d1fa626451f165135139ec9d00306207ba765b2ca3071591009f831b5711fa'){ throw "BlockParEditor EXE hash mismatch: $exeHash" }
          Set-Content -Path 'bpe_path.txt' -Value $exe.FullName -Encoding UTF8

      - name: Build DAT files through BlockParEditor
        shell: pwsh
        run: |
          $exe=(Get-Content 'bpe_path.txt' -Raw).Trim()
          New-Item -ItemType Directory -Force 'dist' | Out-Null
          New-Item -ItemType Directory -Force 'verify' | Out-Null
          & $exe --cli --convert 'fhd_exp_build/Main.txt' 'dist/Main.dat'
          if($LASTEXITCODE -ne 0 -or -not (Test-Path 'dist/Main.dat')){ throw 'Main.dat conversion failed' }
          & $exe --cli --convert 'fhd_exp_build/Lang.txt' 'dist/Lang.dat'
          if($LASTEXITCODE -ne 0 -or -not (Test-Path 'dist/Lang.dat')){ throw 'Lang.dat conversion failed' }
          & $exe --cli --convert 'fhd_exp_build/CacheData.txt' 'dist/CacheData.dat'
          if($LASTEXITCODE -ne 0 -or -not (Test-Path 'dist/CacheData.dat')){ throw 'CacheData.dat conversion failed' }

          & $exe --cli --convert 'dist/Main.dat' 'verify/Main.roundtrip.txt'
          if($LASTEXITCODE -ne 0 -or -not (Test-Path 'verify/Main.roundtrip.txt')){ throw 'Main reverse conversion failed' }
          & $exe --cli --convert 'dist/Lang.dat' 'verify/Lang.roundtrip.txt'
          if($LASTEXITCODE -ne 0 -or -not (Test-Path 'verify/Lang.roundtrip.txt')){ throw 'Lang reverse conversion failed' }
          & $exe --cli --convert 'dist/CacheData.dat' 'verify/CacheData.roundtrip.txt'
          if($LASTEXITCODE -ne 0 -or -not (Test-Path 'verify/CacheData.roundtrip.txt')){ throw 'CacheData reverse conversion failed' }

          $lines=@()
          $lines += 'Official BlockParEditor 2.1 build'
          $lines += 'BlockParEditor ZIP SHA256=d0c4739f9fbf1c276ac6979c13e838b217694ac16400109db7ed53435f0d0253'
          $lines += 'BlockParEditor EXE SHA256=84d1fa626451f165135139ec9d00306207ba765b2ca3071591009f831b5711fa'
          foreach($f in @('dist/Main.dat','dist/Lang.dat','dist/CacheData.dat')){
            $lines += "$f SHA256=$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower()) size=$((Get-Item $f).Length)"
          }
          $lines += 'TXT -> DAT -> TXT reverse conversion: OK for all three files'
          $lines | Set-Content 'BLOCKPAREDITOR_BUILD_REPORT.txt' -Encoding UTF8

      - uses: actions/upload-artifact@v4
        with:
          name: fhd-expedition-blockpar
          path: |
            dist/*
            verify/*
            BLOCKPAREDITOR_BUILD_REPORT.txt

      - name: Commit BlockParEditor outputs to build branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist verify BLOCKPAREDITOR_BUILD_REPORT.txt
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){ exit 0 }
          git commit -m 'BlockParEditor 2.1 outputs [skip ci]'
          git push
